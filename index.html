<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felices 25</title>
<meta name="theme-color" content="#07243c">
<meta name="description" content="Un cumpleaños en algún lugar del internet.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Felices 25">
<meta property="og:description" content="Acerca una plaquita. Alguien tiene algo que decirte.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,500;1,6..96,700&family=Archivo:wght@400;500;600;700&family=Playwrite+ES:wght@200..400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260805162637">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='92'>&#128153;</text></svg>">
</head>
<body class="is-loading">

<div class="grain" aria-hidden="true"></div>

<!-- ===== navegación ===== -->
<nav class="rail" aria-label="Secciones">
  <a href="#hero"   data-nav data-c="ui.navHome"></a>
  <a href="#about"  data-nav data-c="ui.navAbout"></a>
  <a href="#voices" data-nav data-c="ui.navVoices"></a>
  <a href="#letter" data-nav data-c="ui.navLetter"></a>
</nav>

<button class="menu-btn" aria-expanded="false" aria-controls="drawer">
  <span class="menu-btn__bars" aria-hidden="true"><i></i><i></i></span>
  <span class="sr-only" data-c="ui.menu"></span>
</button>
<div class="drawer" id="drawer" hidden>
  <span class="bot bot--pebbles drawer__bot" aria-hidden="true"></span>
  <a href="#hero"   data-nav data-c="ui.navHome"></a>
  <a href="#about"  data-nav data-c="ui.navAbout"></a>
  <a href="#voices" data-nav data-c="ui.navVoices"></a>
  <a href="#letter" data-nav data-c="ui.navLetter"></a>
</div>

<main id="main">

  <!-- ================= PORTADA ================= -->
  <section class="hero" id="hero">
    <span class="bot bot--arch hero__arch" data-drift="0.16" aria-hidden="true"></span>
    <span class="bot bot--grain hero__grain" data-drift="-0.09" aria-hidden="true"></span>

    <div class="wrap hero__grid">
      <div class="hero__type">
        <p class="eyebrow" data-c="hero.eyebrow"></p>
        <p class="script" data-c="hero.script"></p>
        <h1 class="giant">
          <span class="giant__line" data-split data-c="hero.big"></span>
        </h1>
        <p class="hero__name"><span data-c="name"></span></p>
        <p class="hero__sub" data-c="hero.subtitle"></p>
        <p class="hero__date"><span data-c="birthdayLabel"></span></p>
      </div>

      <figure class="plate hero__plate">
        <div class="plate__arch">
          <img class="plate__img" src="media/photos/her-1.jpg" alt="" width="1200" height="1600" fetchpriority="high">
        </div>
        <figcaption class="plate__cap">i</figcaption>
        <span class="bot bot--rings plate__rings" aria-hidden="true"></span>
      </figure>
    </div>

    <a class="cue" href="#about"><span data-c="hero.scrollCue"></span><i aria-hidden="true"></i></a>
  </section>

  <!-- ================= COSAS CIERTAS ================= -->
  <section class="about" id="about">
    <span class="bot bot--stipple about__stip" data-drift="0.22" aria-hidden="true"></span>

    <div class="wrap">
      <header class="sec-head reveal">
        <p class="eyebrow" data-c="about.eyebrow"></p>
        <h2 class="display"><span data-c="about.title"></span><span class="art art--title" data-art="about.art"></span></h2>
        <p class="lede" data-c="about.intro"></p>
      </header>

      <div class="sheet">
        <ol class="things" id="things"></ol>

        <figure class="plate about__plate reveal">
          <div class="plate__arch">
            <img class="plate__img" src="media/photos/her-2.jpg" alt="" loading="lazy" width="1200" height="1600">
          </div>
          <figcaption class="plate__cap">ii</figcaption>
        </figure>
      </div>

      <blockquote class="pull reveal">
        <span class="art art--quote" data-art="about.quoteArt"></span>
        <p data-c="about.quote"></p>
      </blockquote>
    </div>
  </section>

  <!-- ================= LAS VOCES ================= -->
  <section class="voices" id="voices">
    <span class="bot bot--dome voices__dome" data-drift="0.13" aria-hidden="true"></span>
    <div class="wrap">
      <header class="sec-head reveal">
        <p class="eyebrow" data-c="voices.eyebrow"></p>
        <h2 class="display" data-c="voices.title"></h2>
        <p class="lede" data-c="voices.intro"></p>
      </header>
      <ul class="cards" id="cards"></ul>
    </div>
  </section>

  <!-- ================= LA CARTA ================= -->
  <section class="letter" id="letter">
    <span class="bot bot--pebbles letter__peb" data-drift="0.18" aria-hidden="true"></span>
    <div class="wrap letter__grid">
      <figure class="plate letter__plate reveal">
        <div class="plate__arch">
          <img class="plate__img" src="media/photos/her-3.jpg" alt="" loading="lazy" width="1200" height="1600">
        </div>
        <figcaption class="plate__cap">iii</figcaption>
      </figure>
      <div class="letter__text reveal">
        <p class="eyebrow" data-c="letter.eyebrow"></p>
        <h2 class="display" data-c="letter.title"></h2>
        <div class="prose" id="letterBody"></div>
        <div class="note">
          <span class="art art--note" data-art="letter.noteArt"></span>
          <p data-c="letter.note"></p>
        </div>
        <p class="sign">
          <span class="sign__off" data-c="letter.signoff"></span>
          <span class="sign__prefix">
            <span class="art art--sign" data-art="letter.fromArt"></span>
            <span data-c="letter.fromPrefix"></span>
          </span>
          <span class="sign__name" data-c="letter.from"></span>
        </p>
      </div>
    </div>
    <footer class="foot"><span data-c="footer"></span></footer>
  </section>

</main>

<!-- ============ EL REPRODUCTOR — aquí es donde cae la NFC ============ -->
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="playerName">
  <span class="bot bot--arch player__bot" aria-hidden="true"></span>
  <div class="player__inner">
    <button class="player__close" id="playerClose">
      <span aria-hidden="true">←</span><span id="playerBack"></span>
    </button>

    <p class="player__role" id="playerRole"></p>
    <h2 class="player__name" id="playerName"></h2>

    <div class="player__stage" id="playerStage"></div>

    <blockquote class="player__quote">
      <span class="bot bot--rings player__quoteBot" aria-hidden="true"></span>
      <p id="playerPhrase"></p>
      <footer class="player__attrib" id="playerAttrib"></footer>
    </blockquote>

    <nav class="player__pager">
      <button id="prevBtn" class="ghost"></button>
      <button id="nextBtn" class="ghost"></button>
    </nav>
  </div>
</div>

<script src="js/content.js?v=20260805162637"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js?v=20260805162637"></script>
</body>
</html>
