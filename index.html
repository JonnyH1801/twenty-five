<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 25th</title>
<meta name="theme-color" content="#0B1026">
<meta name="description" content="A birthday somewhere on the internet.">
<meta property="og:title" content="Happy 25th">
<meta property="og:description" content="Tap a tag. Someone has something to tell you.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Inter:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
</head>
<body>

<!-- ============ decorative boho shapes, fixed behind everything ============ -->
<svg class="bokeh" aria-hidden="true" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="currentColor"/>
    </pattern>
  </defs>
  <circle class="s1" cx="130" cy="180" r="120" fill="url(#dots)"/>
  <path class="s2" d="M980 120a110 110 0 0 1 220 0v260h-220z"/>
  <circle class="s3" cx="1050" cy="720" r="150"/>
  <path class="s4" d="M-40 640q160-90 320 0t320 0"/>
  <path class="s4" d="M-40 690q160-90 320 0t320 0"/>
  <path class="s4" d="M-40 740q160-90 320 0t320 0"/>
</svg>

<!-- ============ left rail nav (desktop) ============ -->
<nav class="rail" aria-label="Sections">
  <a href="#hero"   data-nav>Home</a>
  <a href="#about"  data-nav>About you</a>
  <a href="#voices" data-nav>The voices</a>
  <a href="#letter" data-nav>From me</a>
</nav>

<!-- ============ mobile menu ============ -->
<button class="menu-btn" aria-expanded="false" aria-controls="drawer">
  <span class="menu-btn__bars" aria-hidden="true"><i></i><i></i></span>
  <span class="sr-only">Menu</span>
</button>
<div class="drawer" id="drawer" hidden>
  <a href="#hero"   data-nav>Home</a>
  <a href="#about"  data-nav>About you</a>
  <a href="#voices" data-nav>The voices</a>
  <a href="#letter" data-nav>From me</a>
</div>

<main id="main">

  <!-- ================= HERO ================= -->
  <section class="hero" id="hero">
    <div class="wrap hero__grid">
      <div class="hero__type">
        <p class="eyebrow" data-c="hero.eyebrow"></p>
        <h1 class="giant">
          <span class="giant__l1" data-c="hero.big1"></span>
          <span class="giant__l2" data-c="hero.big2"></span>
          <span class="giant__script" data-c="hero.script"></span>
        </h1>
        <p class="hero__name"><span data-c="name"></span><span class="dot">.</span></p>
        <p class="hero__sub" data-c="hero.subtitle"></p>
        <p class="hero__date" data-c="birthdayLabel"></p>
      </div>

      <figure class="hero__photo reveal">
        <div class="arch">
          <img src="media/photos/her-1.jpg" alt="" width="1200" height="1600" fetchpriority="high">
        </div>
        <span class="ring" aria-hidden="true"></span>
      </figure>
    </div>

    <a class="cue" href="#about"><span data-c="hero.scrollCue"></span> <i aria-hidden="true"></i></a>
  </section>

  <!-- ================= ABOUT ================= -->
  <section class="about" id="about">
    <div class="wrap">
      <header class="sec-head reveal">
        <p class="eyebrow" data-c="about.eyebrow"></p>
        <h2 class="display" data-c="about.title"></h2>
        <p class="lede" data-c="about.intro"></p>
      </header>

      <div class="about__body">
        <ol class="things" id="things"></ol>

        <figure class="about__photo reveal">
          <div class="arch arch--sm">
            <img src="media/photos/her-2.jpg" alt="" loading="lazy" width="1200" height="1600">
          </div>
        </figure>
      </div>

      <blockquote class="pull reveal">
        <p data-c="about.quote"></p>
      </blockquote>
    </div>
  </section>

  <!-- ================= VOICES ================= -->
  <section class="voices" id="voices">
    <div class="wrap">
      <header class="sec-head sec-head--center reveal">
        <p class="eyebrow" data-c="voices.eyebrow"></p>
        <h2 class="display" data-c="voices.title"></h2>
        <p class="lede" data-c="voices.intro"></p>
      </header>
      <ul class="cards" id="cards"></ul>
    </div>
  </section>

  <!-- ================= LETTER ================= -->
  <section class="letter" id="letter">
    <div class="wrap letter__grid">
      <figure class="letter__photo reveal">
        <div class="arch arch--sm">
          <img src="media/photos/her-3.jpg" alt="" loading="lazy" width="1200" height="1600">
        </div>
      </figure>
      <div class="letter__text reveal">
        <p class="eyebrow" data-c="letter.eyebrow"></p>
        <h2 class="display" data-c="letter.title"></h2>
        <div class="prose" id="letterBody"></div>
        <p class="sign">
          <span class="sign__off" data-c="letter.signoff"></span>
          <span class="sign__name" data-c="letter.from"></span>
        </p>
      </div>
    </div>
    <footer class="foot"><span data-c="footer"></span></footer>
  </section>

</main>

<!-- ================= VIDEO VIEW (NFC lands here) ================= -->
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="playerName">
  <div class="player__inner">
    <button class="player__close" id="playerClose">
      <span aria-hidden="true">←</span> <span>All the voices</span>
    </button>

    <p class="player__role" id="playerRole"></p>
    <h2 class="player__name" id="playerName"></h2>

    <div class="player__stage" id="playerStage"></div>

    <blockquote class="player__quote">
      <p id="playerPhrase"></p>
    </blockquote>

    <nav class="player__pager">
      <button id="prevBtn" class="ghost">← Previous</button>
      <button id="nextBtn" class="ghost">Next →</button>
    </nav>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
